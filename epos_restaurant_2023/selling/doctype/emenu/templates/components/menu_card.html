<div class="menu_category_list_wrapper item">
    <a class="menu_category_list" href="/menu_category?menu_category={{menu.name|urlencode }}&parent_menu={{(parent_menu |urlencode ) or ''}}">
        <div class="category_item position-relative border" style="background: url('{{menu.photo or placeholder_bg}}');background-size: cover;"></div>
        <div class="text-center category_item_title text-dark">{{menu.name}}</div>
    </a>
</div>
