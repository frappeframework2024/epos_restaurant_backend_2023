                         	/**
                         	* Fade-zoom animation for first dialog
                         	*/

                         	/* start state */
                         	.my-mfp-zoom-in .zoom-anim-dialog {
                         		opacity: 0;

                         		-webkit-transition: all 0.2s ease-in-out;
                         		-moz-transition: all 0.2s ease-in-out;
                         		-o-transition: all 0.2s ease-in-out;
                         		transition: all 0.2s ease-in-out;



                         		-webkit-transform: scale(0.8);
                         		-moz-transform: scale(0.8);
                         		-ms-transform: scale(0.8);
                         		-o-transform: scale(0.8);
                         		transform: scale(0.8);
                         	}

                         	/* animate in */
                         	.my-mfp-zoom-in.mfp-ready .zoom-anim-dialog {
                         		opacity: 1;

                         		-webkit-transform: scale(1);
                         		-moz-transform: scale(1);
                         		-ms-transform: scale(1);
                         		-o-transform: scale(1);
                         		transform: scale(1);
                         	}

                         	/* animate out */
                         	.my-mfp-zoom-in.mfp-removing .zoom-anim-dialog {
                         		-webkit-transform: scale(0.8);
                         		-moz-transform: scale(0.8);
                         		-ms-transform: scale(0.8);
                         		-o-transform: scale(0.8);
                         		transform: scale(0.8);

                         		opacity: 0;
                         	}

                         	/* Dark overlay, start state */
                         	.my-mfp-zoom-in.mfp-bg {
                         		opacity: 0;
                         		-webkit-transition: opacity 0.3s ease-out;
                         		-moz-transition: opacity 0.3s ease-out;
                         		-o-transition: opacity 0.3s ease-out;
                         		transition: opacity 0.3s ease-out;
                         	}

                         	/* animate in */
                         	.my-mfp-zoom-in.mfp-ready.mfp-bg {
                         		opacity: 0.8;
                         	}

                         	/* animate out */
                         	.my-mfp-zoom-in.mfp-removing.mfp-bg {
                         		opacity: 0;
                         	}



                         	/**
                         	* Fade-move animation for second dialog
                         	*/

                         	/* at start */
                         	.my-mfp-slide-bottom .zoom-anim-dialog {
                         		opacity: 0;
                         		-webkit-transition: all 0.2s ease-out;
                         		-moz-transition: all 0.2s ease-out;
                         		-o-transition: all 0.2s ease-out;
                         		transition: all 0.2s ease-out;

                         		-webkit-transform: translateY(-20px) perspective(600px) rotateX(10deg);
                         		-moz-transform: translateY(-20px) perspective(600px) rotateX(10deg);
                         		-ms-transform: translateY(-20px) perspective(600px) rotateX(10deg);
                         		-o-transform: translateY(-20px) perspective(600px) rotateX(10deg);
                         		transform: translateY(-20px) perspective(600px) rotateX(10deg);

                         	}

                         	/* animate in */
                         	.my-mfp-slide-bottom.mfp-ready .zoom-anim-dialog {
                         		opacity: 1;
                         		-webkit-transform: translateY(0) perspective(600px) rotateX(0);
                         		-moz-transform: translateY(0) perspective(600px) rotateX(0);
                         		-ms-transform: translateY(0) perspective(600px) rotateX(0);
                         		-o-transform: translateY(0) perspective(600px) rotateX(0);
                         		transform: translateY(0) perspective(600px) rotateX(0);
                         	}

                         	/* animate out */

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"

    <script>
                                                		$(function () {

                                                			$(window).scroll(function(){ 
                                                				var headerHeight = $('.header').height();  
                                                				var headerCateMenu = $('.nav-pro-wrapper').height();  
																if ($(this).scrollTop() > headerHeight) {  
																	$('.nav-pro-wrapper').css('top', 0);
																	$('.nav-pro-wrapper').css('background', '#fff');
																} else {   
																	$('.nav-pro-wrapper').css('background', 'transparent');
																} 
                                                			})

                                                			// Cache menu links and sections
                                                			var menuLinks = $('.nav-pro-wrapper a');
                                                			var sections = $('.sections-content .scroll-section');

                                                			// Handle scroll event
                                                			$(window).scroll(function() {
                                                				var scrollPosition = $(this).scrollTop();
                                                				sections.each(function() {
                                                					var section = $(this);
                                                					var sectionTop = section.offset().top - 220; // Adjust the offset as needed
                                                				});
                                                			});
                                                		});
                                                		{%- block script -%} {%- endblock -%}


                                                		//Function to activate the left scroll button
                                                		const manageLeftbtn = () => {
                                                			if (tabList.scrollLeft >= 20) {
                                                				leftArrowContainer.classList.add("active");
                                                			} else {
                                                				leftArrowContainer.classList.remove("active");
                                                			}
                                                			let maxScroll = tabList.scrollWidth - tabList.clientWidth - 20;
                                                			if (tabList.scrollLeft >= maxScroll) {
                                                				rightArrowContainer.classList.remove("active");
                                                			} else {
                                                				rightArrowContainer.classList.add("active");
                                                			}
                                                		};



                                                		// Adding the dragging functionality
                                                		let drag = false;
                                                		const dragging = (e) => {
                                                		// Add the event parameter
                                                		if (!drag) return;
                                                		tabList.classList.add("dragging");
                                                		tabList.scrollLeft -= e.movementX;
                                                		};



                                                		//go back button
                                                		function goBack (p) {
                                                			const referrer = document.referrer;
                                                			const currentDomain = window.location.hostname;

                                                			if (referrer && new URL(referrer).hostname === currentDomain) {
                                                				history.back();
                                                			} else {
                                                				window.location.href = window.location.origin + '/' + p
                                                			}
                                                		}



                                                		// scroll category on window scroll
                                                		const sections = document.querySelectorAll(".scroll-section");
                                    const buttons = document.querySelectorAll("a.nav-pro");
                                    const wrapper = document.getElementById("cateWrapper");
                                    const wrapperMobile = document.getElementById("cateWrapper_mobile");

                                let currentActive = "";
            let isClickScrolling = false;
            let targetScrollY = 0;


            /* =========================
               CATEGORY CLICK
            ========================= */

            buttons.forEach(btn => {

                btn.addEventListener("click", function (e) {

                    e.preventDefault();

                    const targetId = this.dataset.target;
                    const target = document.getElementById(targetId);

                    if (!target) return;

                    isClickScrolling = true;

                    targetScrollY = target.offsetTop - 100;

                    // Active immediately
                    buttons.forEach(b => b.classList.remove("active"));

                    this.classList.add("active");

                    currentActive = targetId;

                    // Horizontal menu scroll
                    const left =
                        (this.offsetLeft -
                        wrapper.clientWidth / 2 +
                        this.clientWidth / 2) || (this.offsetLeft -
                        wrapperMobile.clientWidth / 2 +
                        this.clientWidth / 2);

                    wrapper.scrollTo({
                        left,
                        behavior: "smooth"
                    }) || wrapperMobile.scrollTo({
                        left,
                        behavior: "smooth"
                    });

                    // Vertical page scroll
                    window.scrollTo({
                        top: targetScrollY,
                        behavior: "smooth"
                    });
                });
            });

                                    /* =========================
                                       SCROLL DETECT ACTIVE
                                    ========================= */
                                    window.addEventListener("scroll", () => {

                /* =========================
                   WAIT UNTIL TARGET REACHED
                ========================= */

                if (isClickScrolling) {

                    const reachedTarget =
                        Math.abs(window.scrollY - targetScrollY) < 5;

                    if (!reachedTarget) return;

                    isClickScrolling = false;
                }

                let current = "";

                /* =========================
                   FIRST CATEGORY
                ========================= */

                if (window.scrollY <= 50) {

                    current = sections[0].id;

                } else {

                    const scrollPosition =
                        window.scrollY + 200;

                    sections.forEach(section => {

                        const sectionTop = section.offsetTop;
                        const sectionHeight = section.offsetHeight;

                        if (
                            scrollPosition >= sectionTop &&
                            scrollPosition < sectionTop + sectionHeight
                        ) {
                            current = section.getAttribute("id");
                        }
                    });

                    /* =========================
                       LAST CATEGORY
                    ========================= */

                    if (
                        window.innerHeight + window.scrollY >=
                        document.documentElement.scrollHeight - 10
                    ) {
                        current = sections[sections.length - 1].id;
                    }
                }

                if (current === currentActive) return;

                currentActive = current;

                buttons.forEach(btn => {

                    btn.classList.remove("active");

                    if (btn.dataset.target === current) {

                        btn.classList.add("active");

                        // Horizontal auto center
                        const left =
                            (btn.offsetLeft -
                            wrapper.clientWidth / 2 +
                            btn.clientWidth / 2) || (btn.offsetLeft -
                            wrapperMobile.clientWidth / 2 +
                            btn.clientWidth / 2);

                        wrapper.scrollTo({
                            left,
                            behavior: "smooth"
                        }) || wrapperMobile.scrollTo({
      					  left,
      					  behavior: "smooth"
      				  });
                    }
                });

            }, { passive: true });


                  			// rotate arrow button
                        	 const scrollLeftBtn = document.getElementById("scrollLeft");
                  const scrollRightBtn = document.getElementById("scrollRight");


                  /* =========================
                     UPDATE ARROW BUTTONS
                  ========================= */

                  function updateArrowButtons() {

                      const scrollLeft = wrapper.scrollLeft || wrapperMobile.scrollLeft;

                      const maxScroll =
                          wrapper.scrollWidth - wrapper.clientWidth || wrapperMobile.scrollWidth - wrapperMobile.clientWidth;

                      // LEFT BUTTON
                      if (scrollLeft <= 5) {

                          scrollLeftBtn.classList.remove("active");

                      } else {

                          scrollLeftBtn.classList.add("active");
                      }

                      // RIGHT BUTTON
                      if (scrollLeft >= maxScroll - 5) {

                          scrollRightBtn.classList.remove("active");

                      } else {

                          scrollRightBtn.classList.add("active");
                      }
                  }


                  /* =========================
                     BUTTON CLICK
                  ========================= */

                  scrollLeftBtn.addEventListener("click", () => {

                      wrapper.scrollBy({
                          left: -250,
                          behavior: "smooth"
                      }) || wrapperMobile.scrollBy({
      					left: -250,
      					behavior: "smooth"
      				});

                  });

                  scrollRightBtn.addEventListener("click", () => {

                      wrapper.scrollBy({
                          left: 250,
                          behavior: "smooth"
                      }) || wrapperMobile.scrollBy({
      					left: 250,
      					behavior: "smooth"
      				});

                  });


                  /* =========================
                     DETECT MANUAL SCROLL
                  ========================= */

                  wrapper.addEventListener("scroll", updateArrowButtons) || wrapperMobile.addEventListener("scroll", updateArrowButtons);


                  /* =========================
                     INITIAL CHECK
                  ========================= */

                  updateArrowButtons();


      			const hamburgerNav = document.getElementById("hamburgerNav");
      const smallScxCate = document.querySelector(".small-scx-cate");
      const hamburgerNavHideMenu = document.getElementById("hamburgerNavHideMenu");

      hamburgerNav.addEventListener("click", function () {
          smallScxCate.classList.add("show");

          // optional fade button
          this.style.opacity = "0";
          this.style.pointerEvents = "none";
      });

      hamburgerNavHideMenu.addEventListener("click", function () {
          smallScxCate.classList.remove("show");

          hamburgerNav.style.opacity = "1";
          hamburgerNav.style.pointerEvents = "auto";
      });





	  const sectionTitles = document.querySelectorAll('.section-title');

function handleStickyTitles() {

    sectionTitles.forEach(title => {

        const rect = title.getBoundingClientRect();

        /*
            top:70px in CSS
            detect when title reached sticky point
        */
        if (rect.top <= 70) {
            title.classList.add('is-sticky');
        } else {
            title.classList.remove('is-sticky');
        }

    });

}

window.addEventListener('scroll', handleStickyTitles);

handleStickyTitles();
    </script>
