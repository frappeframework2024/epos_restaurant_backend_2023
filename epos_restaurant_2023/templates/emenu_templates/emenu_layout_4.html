<html lang="en">
  <head>

    />
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"

    <title>{%- block title -%} {%- endblock -%}</title>
    {{ include_style('website.bundle.css') }}
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <style type="text/css">
                  @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');


                	  /* ====================== */
                .emenu-template-4{
                  display:flex;
                  height:100vh;
                  background: linear-gradient(to bottom, #1f9a9a 0%, #6faeb0 40%, #cfd6d8 75%, #f2f2f2 100%);
                }

                /* Sidebar */
                .sidebar, .sidebar-mobile{
                  width:240px;
                  background:#047575c7;
                  color:#fff;
                  /* padding:15px; */
                  overflow-y:auto;
                }
                .sidebar h3, .sidebar-mobile h3{
                  padding: 15px 0 0 15px;
                }
                .menu-cate {
                  padding:15px;
                }
                .sidebar h3, .sidebar-mobile h3{
                  margin-bottom:10px;
                  color:#fff;
                }
                .menu-item{
                  padding:10px;
                  border-radius:8px;
                  margin-bottom:6px;
                  cursor:pointer;
                }
                .menu-item.active{background:rgb(4, 117, 117)}
                .menu-item:hover{background:rgba(255,255,255,0.15)}

                /* Main */
                .main{flex:1;display:flex;flex-direction:column}
                .header-p{
                  height:55px;
                  background:rgb(4, 117, 117);
                  color:#fff;
                  display:flex;
                  align-items:center;
                  padding:0 20px;
                  gap: 10px;
                }
                /* .product_items {
                  margin-top: 75px;
                } */

                .content{
                  padding:15px;
                  overflow:auto;
                  height: -webkit-fill-available;
                }
                .section-title{
                  color:#fff;
                  margin:10px 0;
                  font-weight:600;
                }

                .grid{
                  display:grid;
                  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
                  gap:14px;
                }

                .p-card{
                  display:flex;
                  background:#fff;
                  border-radius:12px;
                  overflow:hidden;
                  box-shadow:0 4px 10px rgba(0,0,0,0.1);
                }
                .card img{
                  width:110px;
                  height:90px;
                  object-fit:cover;
                }
                .card-body{
                  flex:1;
                  padding:10px;
                  display:flex;
                  flex-direction:column;
                }
                .title{font-size:14px;color:#333}
                .price{color:#d32f2f;font-weight:600;margin-top:4px}

                .add-btn{
                  width:28px;
                  height:28px;
                  border-radius:50%;
                  background:#2b8a86;
                  color:#fff;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  margin-right:10px;
                  font-weight:bold;
                }

                /* Footer */
                .footer{
                  height:55px;
                  background:#1f7a76;
                  color:#fff;
                  display:flex;
                  justify-content:flex-end;
                  align-items:center;
                  gap:20px;
                  padding:0 20px;
            position: fixed;
            bottom: 0;
            right: 0;
            left: 240px;
                }
                .btn{
                  background:#2b8a86;
                  border:none;
                  padding:10px 16px;
                  color:#fff;
                  border-radius:6px;
                  cursor:pointer;
                }
                .image-wrapper {
                  background-image: url("/files/purty_wood.png");
                  width: 40%;
                  height: 120px;
                  overflow: hidden;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                }
                .image-wrapper img {
                  width: 80%;
                  height: 80%;
                  -o-object-fit: contain;
                  object-fit: contain;
                  transition: transform .3s;
                }
                .image-ph {
                  width: 100% !important;
                  height: 100% !important;
                  -o-object-fit: cover !important;
                  object-fit: cover !important;
                }
                .content .product_items:not(:first-child) {
                  margin-top: 30px;
                }
                .emenu-title {
                  font-size: 20px;
                  color: #fff;
                  letter-spacing: 1px;
                }
                .menu-cate {
                  height: calc(100vh - 74px);
                  overflow: auto;
                }
                .sidebar-mobile {
                  display: none;
                  position: fixed;
                  top: 0;
                  left: 0;
                  z-index: 999;
                  background-color: #047575;
                  transform: translateX(-240px); /* hidden */
                  transition: transform 0.3s ease-in-out;
                  will-change: transform;
                }
                .sidebar-mobile.open {
                  transform: translateX(0); /* visible */
                }
                #toggle_btn, #close_btn {
                  display: none;
                }
                @media (max-width: 767.98px) {
                  .sidebar-mobile {
                    display: block;
                  }
                  .sidebar {
                    display: none;
                  }
                  #toggle_btn, #close_btn {
                    display: block;
                  }
                }

                /* width of scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
      }

      /* track (background) */
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }

      /* handle (the draggable part) */
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }

      /* hover effect */
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }

                      		{%- block style -%}{%- endblock -%}
    </style>

    <script>
      window.frappe = {};
      frappe.ready_events = [];
      frappe.ready = function (fn) {
        frappe.ready_events.push(fn);
      };
    </script>
  </head>

  <body>
    <!-- <h1>Emenu</h1> -->
    {%- block page_content -%}{%- endblock -%}
    <div class="loading"></div>

    <!-- js should be loaded in body! -->

    <script>
      frappe.boot = {{ boot }}
      // for backward compatibility of some libs
      frappe.sys_defaults = frappe.boot.sysdefaults;
    </script>
    {{ include_script('frappe-web.bundle.js') }}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>

    <script>
      $(function () {});

      // ===============================
      // ELEMENTS
      // ===============================
      const menuItem = document.querySelectorAll(".menu-item");
      const content = document.getElementById("item_content");
      const sections = document.querySelectorAll(".product_items");

      const OFFSET_CLICK = 75; // scroll offset when clicking
      const OFFSET_ACTIVE = 100; // when switching active while scrolling

      // ===============================
      // CLICK → SCROLL TO SECTION
      // ===============================
      menuItem.forEach((cat) => {
        cat.addEventListener("click", () => {
          // remove active
          menuItem.forEach((c) => c.classList.remove("active"));
          cat.classList.add("active");

          const target = document.getElementById(cat.dataset.target);
          if (!target) return;

          content.scrollTo({
            top: target.offsetTop - OFFSET_CLICK,
            behavior: "smooth",
          });

          // also ensure sidebar follows
          scrollSidebarToActive();
        });
      });

      // ===============================
      // AUTO SCROLL SIDEBAR
      // ===============================
      function scrollSidebarToActive() {
        const active = document.querySelector(".menu-item.active");
        if (!active) return;

        active.scrollIntoView({
          behavior: "smooth",
          block: "nearest", // prevent jumping
          inline: "nearest",
        });
      }

      // ===============================
      // SCROLL → ACTIVE CATEGORY
      // ===============================
      function updateActiveOnScroll() {
        let current = "";

        const scrollTop = content.scrollTop;
        const scrollHeight = content.scrollHeight;
        const clientHeight = content.clientHeight;

        // ✅ Fix: last section activation
        if (scrollTop + clientHeight >= scrollHeight - 5) {
          current = sections[sections.length - 1]?.id;
        } else {
          sections.forEach((section) => {
            const sectionTop = section.offsetTop - content.offsetTop;

            if (scrollTop >= sectionTop - OFFSET_ACTIVE) {
              current = section.id;
            }
          });
        }

        let changed = false;

        menuItem.forEach((cat) => {
          const isActive = cat.dataset.target === current;

          if (isActive && !cat.classList.contains("active")) {
            changed = true;
          }

          cat.classList.toggle("active", isActive);
        });

        // ✅ Only scroll sidebar when active actually changes
        if (changed) {
          scrollSidebarToActive();
        }
      }

      // attach scroll listener
      content.addEventListener("scroll", updateActiveOnScroll);

      // ===============================
      // INIT (PAGE LOAD / RELOAD)
      // ===============================
      function setInitialActive() {
        if (!menuItem.length || !sections.length) return;

        if (content.scrollTop === 0) {
          // top → first category
          menuItem.forEach((c) => c.classList.remove("active"));
          menuItem[0].classList.add("active");

          scrollSidebarToActive();
        } else {
          // reload at scroll position
          updateActiveOnScroll();
        }
      }

      // wait for DOM fully loaded
      window.addEventListener("load", () => {
        // small delay helps if content renders dynamically (Frappe)
        setTimeout(setInitialActive, 50);
      });

      const btn = document.getElementById("toggle_btn");
      const btn_close = document.getElementById("close_btn");
      const sidebarMobile = document.querySelector(".sidebar-mobile");

      btn.addEventListener("click", (e) => {
        sidebarMobile.classList.toggle("open");
        e.stopPropagation(); // prevent triggering document click
      });

      btn_close.addEventListener("click", () => {
        sidebarMobile.classList.remove("open");
      });

      // click outside
      document.addEventListener("click", (e) => {
        if (
          sidebarMobile.classList.contains("open") &&
          !sidebarMobile.contains(e.target) &&
          e.target !== btn
        ) {
          sidebarMobile.classList.remove("open");
        }
      });
    </script>
  </body>
</html>
