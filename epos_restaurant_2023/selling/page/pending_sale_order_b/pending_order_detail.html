
{% if sales %}
<div class="row">
  {%for s in sales%} 
    <div data-sale="{{s.sale}}" class="text-center col m-2 rounded p-2 flex-column sale-item d-flex justify-content-center align-items-center"  style="background: {{s.background}};color:{{s.color}};min-height:80px; min-width:150px;max-width:150px;">
      <div>
        {{s.name}}
      </div>
        <div>
          <small>{{s.time_ago}}</small>        
        </div>      
    </div> 
  {%endfor%}
</div>
{%else%}
  <div style="height:80vh;">
    <iframe src="{{iframe}}" style="width:100%; height:100%; border:none;"></iframe>
  </div>
{%endif%}
