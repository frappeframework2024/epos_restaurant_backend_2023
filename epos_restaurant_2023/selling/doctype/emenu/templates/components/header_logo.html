<div class="header d-flex justify-content-between align-items-center">
    {% if back_btn  %}
        <a class="text-dark position-absolute left-0 back-btn-back" href="/menu_category?menu_category={{back_btn}}">&#8592; Back</a>
    {%endif%}
    <div class="logo position-absolute start-50 translate-middle-x">
        <img loading="lazy" src="{{doc.logo or '/files/no_image.jpg'}}" alt="" style="height:60px;">
    </div>
     
       <div class="ml-auto dropdown">
        <!-- Circle flag button -->
        <a class="btn btn-light no-caret p-0"
            href="#" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
            style="height:40px; display:flex; align-items:center; justify-content:center; font-size:20px;margin-right: 5px;">
            🌐<span id="current-flag"></span>
        </a>
            <div class="dropdown-menu dropdown-menu-right">
                <a class="dropdown-item" href="#" onclick="setLanguage('en','English'); return false;">English</a>
                <a class="dropdown-item" href="#" onclick="setLanguage('kh','ខ្មែរ'); return false;">ខ្មែរ</a>
                <a class="dropdown-item" href="#" onclick="setLanguage('cn','中文'); return false;">中文</a>
            </div>
        </div>
</div>
<script>
function setLanguage(lang,full_lang) {
    localStorage.setItem('language', lang);
    localStorage.setItem('full_language', full_lang);
    const url = new URL(window.location.href);
    window.location.href = url.toString();
}
document.addEventListener("DOMContentLoaded", function() {
    let lang =  localStorage.getItem("full_language") || "English"
    document.getElementById("current-flag").textContent = lang;
})
</script>
