<div class="py-3 my-3 nav-pro-wrapper border border-start-0 border-end-0 bg-white el-shadow" style="top:0;">
    <nav class="container">
        <div class="position-relative">
            <div class="tab-bar">
                <div class="left-arrow">
                    <p><i class="fas fa-chevron-left"></i></p>
                </div>
                <div class="navigt tabs">
                    <div class="d-flex mb-0 navigt-inner">
                        {% for m in shortcut_menu %} 
                        <a class="bg-white px-3 py-1 rounded-pill main-color nav-pro tab mt-1 menu_categories" 
                            href="/menu_category?menu_category={{m.name|urlencode }}&parent_menu={{(m.parent_pos_menu|urlencode ) or ''}}">
                            <p>{{m.name}}</p>
                        </a>
                        {%endfor%}
                    </div>
                </div>
                <div class="right-arrow active">
                    <p><i class="fas fa-chevron-right"></i></p>
                </div>
            </div>
        </div>
    </nav>
</div>
